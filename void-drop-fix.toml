# D2RLoader Void Drop Fix Configuration
# Prevents items, runes, and gold from vanishing when monsters die over void/abyss tiles.

[general]
# Master switch for the void drop protection hook.
enabled = true

# Log recoveries to the D2RLoader console and log file when an item is saved from the void.
log_recoveries = false

# Search radius (in tiles) used to find the nearest valid walkable ground/ledge.
# Default is 64 tiles (covers over two full screens of distance, guaranteeing
# that any monster dying out in the void will find a nearby walkway/platform).
search_radius = 64
